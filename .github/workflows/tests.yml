# Test workflow for pull requests

name: Tests
on:
  pull_request:
    branches: [main]
jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore AffirmationGenerator.slnx
      - name: Build
        run: dotnet build AffirmationGenerator.slnx --no-restore
      - name: Test
        run: dotnet test AffirmationGenerator.slnx --no-build --verbosity normal
